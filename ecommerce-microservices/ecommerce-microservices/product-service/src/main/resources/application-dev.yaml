spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/microserviceAppDb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50

logging:
  level:
    org.shub.productservice: DEBUG
